spring.application.name=JSON XML editor
server.port=${PORT:8085}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
baseurl=${BASE_URL:http://localhost:8085}
email.api.key=${SMTP_KEY:}
# Share Drop uploads: 30 MB per file (Spring's default is only 1 MB).
# The request limit is a little higher to leave room for the other form fields.
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
# Read (and discard) the rest of an oversized upload so the browser gets a proper
# "file too large" response instead of a dropped connection
server.tomcat.max-swallow-size=32MB
# Mail Configuration (optional, configured via environment variables)
#spring.mail.host=${SPRING_MAIL_HOST}
#spring.mail.port=${SPRING_MAIL_PORT}
#spring.mail.username=${SPRING_MAIL_USERNAME}
#spring.mail.password=${SPRING_MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=false
#spring.mail.properties.mail.smtp.connectiontimeout=5000
#spring.mail.properties.mail.smtp.timeout=5000
#spring.mail.properties.mail.smtp.writetimeout=5000
# Keep-alive: Render's free plan sleeps after 15 minutes without traffic, so the app pings
# its own public URL every 13 minutes. Render sets RENDER_EXTERNAL_URL itself; locally it's
# empty and the ping is off. KEEP_ALIVE_ENABLED=false turns it off on Render too.
keepalive.url=${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
keepalive.enabled=${KEEP_ALIVE_ENABLED:true}
keepalive.interval=${KEEP_ALIVE_INTERVAL:PT13M}
# Gzip text responses (HTML, CSS, JS, JSON): pages load several times faster
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/xml,application/javascript,text/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024
