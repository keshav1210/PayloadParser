<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Application Health – JSON XML Editor</title>
    <link rel="stylesheet" href="/css/site.css?v=4">
    <style>
        .health { max-width: 720px; margin: 48px auto; padding: 0 20px; }
        .health h1 { font-size: 26px; color: var(--text-strong); margin-bottom: 14px; }
        .overall { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        .UP { color: var(--success); }
        .DOWN, .OUT_OF_SERVICE { color: var(--danger); }
        .component { margin-bottom: 12px; }
        .component h2 { font-size: 16px; color: var(--text-strong); text-transform: capitalize; margin-bottom: 4px; }
        .component table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
        .component td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; word-break: break-word; }
        .component td:first-child { color: var(--muted); width: 40%; }
    </style>
</head>
<body>

<main class="health">
    <h1>Application health</h1>
    <div id="overallStatus" class="overall">Checking…</div>
    <div id="components"></div>
</main>

<script>
    function cell(text) {
        const td = document.createElement('td');
        td.textContent = typeof text === 'object' ? JSON.stringify(text) : String(text);
        return td;
    }

    fetch('/actuator/health')
        .then(response => response.json())
        .then(data => {
            const statusDiv = document.getElementById('overallStatus');
            statusDiv.textContent = 'Overall status: ' + data.status;
            statusDiv.classList.add(data.status);

            const componentsDiv = document.getElementById('components');
            for (const [key, value] of Object.entries(data.components || {})) {
                const card = document.createElement('div');
                card.className = 'card component';
                const title = document.createElement('h2');
                title.textContent = key;
                const status = document.createElement('div');
                status.className = value.status;
                status.textContent = 'Status: ' + value.status;
                card.append(title, status);

                if (value.details) {
                    const table = document.createElement('table');
                    for (const [dKey, dVal] of Object.entries(value.details)) {
                        const tr = document.createElement('tr');
                        tr.append(cell(dKey), cell(dVal));
                        table.appendChild(tr);
                    }
                    card.appendChild(table);
                }
                componentsDiv.appendChild(card);
            }
        })
        .catch(err => {
            document.getElementById('overallStatus').textContent = 'Failed to load health status';
            console.error(err);
        });
</script>

</body>
</html>
